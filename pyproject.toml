[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dental-clinic"
version = "0.2.0"
description = "Offline dental clinic backend foundation (development prototype)"
requires-python = ">=3.11"
dependencies = ["argon2-cffi>=23.1,<26", "cryptography>=43,<47"]

[project.optional-dependencies]
dev = ["ruff>=0.7", "mypy>=1.11", "pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 99
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # multiline SQL migration strings are intentionally readable
