<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ورود به سامانه | کلینیک دندانپزشکی صدف</title>
  <!-- Vazirmatn Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Vazirmatn', 'Tahoma', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#f0fdfa',
              100: '#ccfbf1',
              200: '#99f6e4',
              300: '#5eead4',
              400: '#2dd4bf',
              500: '#14b8a6',
              600: '#0d9488',
              700: '#0f766e',
              800: '#115e59',
              900: '#134e4a',
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Vazirmatn', Tahoma, sans-serif;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen flex flex-col justify-between selection:bg-brand-500 selection:text-white">

  <!-- Header -->
  <header class="bg-white border-b border-slate-200">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-brand-600 to-teal-400 flex items-center justify-center text-white shadow-sm font-bold text-sm">
          🦷
        </div>
        <span class="text-base font-extrabold text-slate-900">کلینیک دندانپزشکی <span class="text-brand-600">صدف</span></span>
      </a>

      <a href="index.html" class="inline-flex items-center gap-1.5 text-xs font-semibold text-slate-600 hover:text-brand-600 px-3 py-1.5 rounded-lg hover:bg-slate-100 transition-colors">
        <span>صفحه اصلی</span>
        <svg class="w-3.5 h-3.5 rotate-180" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
        </svg>
      </a>
    </div>
  </header>

  <!-- Login Main -->
  <main class="flex-grow flex items-center justify-center p-4 py-10">
    <div class="bg-white rounded-3xl max-w-md w-full p-6 sm:p-8 shadow-xl border border-slate-200/80">
      
      <!-- Top Icon & Header -->
      <div class="text-center mb-6">
        <div class="w-14 h-14 bg-brand-50 text-brand-600 rounded-2xl flex items-center justify-center mx-auto mb-3 shadow-inner">
          <svg class="w-7 h-7" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
          </svg>
        </div>
        <h1 class="text-xl sm:text-2xl font-black text-slate-900">ورود به پنل کاربری</h1>
        <p class="text-xs text-slate-500 mt-1">جهت مشاهده نوبت‌ها و سوابق درمانی</p>
      </div>

      <!-- Tab Buttons: Patient vs Staff -->
      <div class="flex bg-slate-100 p-1 rounded-xl mb-6 text-xs font-bold">
        <button type="button" id="tabPatientBtn" onclick="switchTab('patient')" class="flex-1 py-2 rounded-lg bg-white text-slate-900 shadow-sm transition-all">
          بیماران و مراجعین
        </button>
        <button type="button" id="tabStaffBtn" onclick="switchTab('staff')" class="flex-1 py-2 rounded-lg text-slate-500 hover:text-slate-900 transition-all">
          پرسنل و پزشکان
        </button>
      </div>

      <!-- Notification message box -->
      <div id="loginAlert" class="hidden mb-4 p-3 rounded-xl text-xs font-medium"></div>

      <!-- Form 1: Patient Login -->
      <form id="patientLoginForm" onsubmit="handlePatientLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1.5">شماره همراه <span class="text-rose-500">*</span></label>
          <input type="tel" id="patientPhoneInput" required placeholder="۰۹۱۲۳۴۵۶۷۸۹" dir="ltr" value="09123456789" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:border-brand-500 focus:ring-2 focus:ring-brand-200 outline-none text-sm text-right transition-all">
          <span class="text-[11px] text-slate-400 mt-1 block">شماره موبایلی که با آن نوبت ثبت کرده‌اید.</span>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1.5">کد ملی یا رمز عبور</label>
          <input type="password" id="patientPassInput" placeholder="••••••••" value="123456" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:border-brand-500 focus:ring-2 focus:ring-brand-200 outline-none text-sm transition-all">
        </div>

        <button type="submit" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-bold py-3 px-4 rounded-xl text-sm transition-all shadow-md shadow-brand-600/20 flex items-center justify-center gap-2">
          <span>ورود به سامانه</span>
          <svg class="w-4 h-4 -rotate-90" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
          </svg>
        </button>

        <div class="text-center pt-2">
          <p class="text-xs text-slate-500">
            هنوز نوبتی ثبت نکرده‌اید؟
            <a href="booking.html" class="text-brand-600 font-bold hover:underline">رزرو اولین نوبت</a>
          </p>
        </div>
      </form>

      <!-- Form 2: Staff / Doctor Login -->
      <form id="staffLoginForm" onsubmit="handleStaffLogin(event)" class="space-y-4 hidden">
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1.5">نام کاربری یا کد پرسنلی <span class="text-rose-500">*</span></label>
          <input type="text" id="staffUserInput" required placeholder="dr_radmanesh" value="dr_radmanesh" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:border-brand-500 focus:ring-2 focus:ring-brand-200 outline-none text-sm transition-all">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1.5">کلمه عبور <span class="text-rose-500">*</span></label>
          <input type="password" id="staffPassInput" required placeholder="••••••••" value="admin123" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:border-brand-500 focus:ring-2 focus:ring-brand-200 outline-none text-sm transition-all">
        </div>

        <button type="submit" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-3 px-4 rounded-xl text-sm transition-all shadow-md flex items-center justify-center gap-2">
          <span>ورود به پنل مدیریت</span>
          <svg class="w-4 h-4 -rotate-90" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
          </svg>
        </button>

        <p class="text-[11px] text-slate-400 text-center pt-2">
          دسترسی مختص پزشکان، منشی‌ها و مدیران کلینیک (نسخه دمو)
        </p>
      </form>

    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-500">
    سامانه مدیریت کلینیک دندانپزشکی صدف (نسخه آزمایشی / دمو)
  </footer>

  <script>
    let currentRole = 'patient';

    function switchTab(role) {
      currentRole = role;
      const patientBtn = document.getElementById('tabPatientBtn');
      const staffBtn = document.getElementById('tabStaffBtn');
      const patientForm = document.getElementById('patientLoginForm');
      const staffForm = document.getElementById('staffLoginForm');
      const alertBox = document.getElementById('loginAlert');
      alertBox.classList.add('hidden');

      if (role === 'patient') {
        patientBtn.className = 'flex-1 py-2 rounded-lg bg-white text-slate-900 shadow-sm transition-all';
        staffBtn.className = 'flex-1 py-2 rounded-lg text-slate-500 hover:text-slate-900 transition-all';
        patientForm.classList.remove('hidden');
        staffForm.classList.add('hidden');
      } else {
        staffBtn.className = 'flex-1 py-2 rounded-lg bg-white text-slate-900 shadow-sm transition-all';
        patientBtn.className = 'flex-1 py-2 rounded-lg text-slate-500 hover:text-slate-900 transition-all';
        staffForm.classList.remove('hidden');
        patientForm.classList.add('hidden');
      }
    }

    function showAlert(text, isSuccess) {
      const alertBox = document.getElementById('loginAlert');
      alertBox.innerText = text;
      alertBox.className = isSuccess 
        ? 'mb-4 p-3 rounded-xl text-xs font-bold bg-emerald-50 text-emerald-800 border border-emerald-200 block'
        : 'mb-4 p-3 rounded-xl text-xs font-bold bg-rose-50 text-rose-800 border border-rose-200 block';
    }

    function handlePatientLogin(e) {
      e.preventDefault();
      const phone = document.getElementById('patientPhoneInput').value.trim();
      showAlert('ورود موفقیت‌آمیز بود! در حال هدایت به بخش نوبت‌ها...', true);
      setTimeout(() => {
        window.location.href = 'booking.html';
      }, 1200);
    }

    function handleStaffLogin(e) {
      e.preventDefault();
      const user = document.getElementById('staffUserInput').value.trim();
      showAlert(`خوش آمدید (${user})! دسترسی به پنل دمو تایید شد. هدایت به صفحه نوبت‌ها...`, true);
      setTimeout(() => {
        window.location.href = 'booking.html';
      }, 1200);
    }
  </script>
</body>
</html>
